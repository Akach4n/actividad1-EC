<article class="group relative transition-transform duration-300 hover:-rotate-1">
  <a [routerLink]="detailLink()" class="block">
    <div class="border border-ink/40 bg-cream p-1.5 shadow-[2px_3px_8px_rgba(58,42,28,0.3)]">
      <div class="aspect-[2/3] overflow-hidden bg-paper">
        @if (posterUrl(); as url) {
          <img
            [src]="url"
            [alt]="item().title"
            loading="lazy"
            class="h-full w-full object-cover sepia-[.3] transition duration-300 group-hover:sepia-0"
          />
        } @else {
          <div class="flex h-full items-center justify-center p-4 text-center font-mono text-xs text-muted">
            Sin cartel
          </div>
        }
      </div>
    </div>

    <div class="mt-3 flex items-start gap-3">
      @if (rank()) {
        <span class="font-logo text-3xl leading-none text-accent">{{ rankLabel() }}</span>
      }
      <div class="min-w-0">
        <h3
          class="font-display text-lg leading-tight font-semibold group-hover:text-accent"
          [title]="item().title"
        >
          {{ item().title }}
        </h3>
        <p class="mt-1 font-mono text-xs text-muted">
          {{ year() || 's/f' }} · ★ {{ item().voteAverage | number: '1.1-1' }}
        </p>
      </div>
    </div>
  </a>

  <div class="absolute top-3 right-3">
    <app-favorite-button [item]="item()" />
  </div>
</article>
